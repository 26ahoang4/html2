<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Creative Portfolio | Home</title>
    <link rel="preload" as="image" href="portrait_6.jpeg">
    <style>
        /* Fancy Slideshow Styles */
        .hero-slideshow {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-bottom: 50px;
        }

        .slide-container {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slide-animation 15s infinite;
        }

        .slide {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        .slide-caption {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: white;
            text-align: left;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .slide-caption h3 {
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes slide-animation {
            0% { transform: translateX(0); }
            30% { transform: translateX(0); }
            33% { transform: translateX(-33.33%); }
            63% { transform: translateX(-33.33%); }
            66% { transform: translateX(-66.66%); }
            96% { transform: translateX(-66.66%); }
            100% { transform: translateX(0); }
        }

        /* Skeleton Background for the hero area */
        .hero-slideshow {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
    </style>
</head>
<body>
    <table class="menu-table">
        <tr>
            <td><a href="index.html" style="color: #00d1b2;">Home</a></td>
            <td><a href="photo.html">Photography</a></td>
            <td><a href="design.html">Design</a></td>
            <td><a href="contact.html">Contact</a></td>
            <td><a href="video.html">Videos</a></td>
        </tr>
    </table>

    <div class="container">
        <header style="margin-bottom: 60px;">
            <h1 style="color: #2c3e50; font-size: 4rem; letter-spacing: -1px; margin-bottom: 0;">VISUAL JOURNEY</h1>
            <p style="color: #7f8c8d; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 5px;">Photography & Digital Design</p>
        </header>

        <div class="hero-slideshow">
            <div class="slide-container">
                <div class="slide">
                    <img src="portrait_6.jpeg" alt="Featured Portrait" fetchpriority="high">
                    <div class="slide-caption">
                        <h3>Portrait Excellence</h3>
                    </div>
                </div>
                <div class="slide">
                    <img src="portrait_duo_action_1.jpeg" alt="Action Photography">
                    <div class="slide-caption">
                        <h3>Dynamic Moments</h3>
                    </div>
                </div>
                <div class="slide">
                    <img src="rising_star_design.jpeg" alt="Graphic Design">
                    <div class="slide-caption">
                        <h3>Digital Creativity</h3>
                    </div>
                </div>
            </div>
        </div>

        <h2 style="margin-bottom: 40px; font-weight: 300;">Featured Gallery</h2>

        <table class="content-table" style="width: 100%;">
            <tr>
                <td>
                    <div class="img-wrapper">
                        <img src="portrait_5.jpeg" alt="Portrait Five" loading="lazy">
                    </div>
                    <h3 style="color: #2c3e50; font-size: 1.2rem; margin-top: 20px;">The Artist</h3>
                </td>
                <td>
                    <div class="img-wrapper">
                        <img src="sweet_candy_photo.jpeg" alt="Sweet Candy" loading="lazy">
                    </div>
                    <h3 style="color: #2c3e50; font-size: 1.2rem; margin-top: 20px;">Vibrant Still Life</h3>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
