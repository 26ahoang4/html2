<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Journey | Advanced Portfolio</title>
    <style>
        :root {
            --accent: #00d1b2;
            --bg-dark: #0f172a;
            --text-light: #f8fafc;
        }

        body {
            background-color: #f1f5f9; /* Light background for the page */
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navigation */
        .menu-table {
            width: 100%;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-table td {
            padding: 20px;
            text-align: center;
        }

        .menu-table a {
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .menu-table a:hover { color: var(--accent); }

        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 4rem;
            margin: 0;
            color: #1e293b;
            letter-spacing: -2px;
            font-weight: 900;
        }

        /* Advanced Slideshow with Background Blur */
        .hero-slideshow {
            position: relative;
            width: 100%;
            height: 650px; /* Taller for more impact */
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            background: #000;
        }

        .slide-container {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slide-cycle 18s infinite cubic-bezier(0.85, 0, 0.15, 1);
        }

        .slide {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The Blurred Backdrop */
        .blur-backdrop {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            object-fit: cover;
            filter: blur(50px) brightness(0.4) saturate(1.2);
            z-index: 1;
            opacity: 0.8;
        }

        /* The Main Sharp Image */
        .main-img {
            position: relative;
            z-index: 2;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Keeps original proportions */
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 60px 40px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: white;
            z-index: 10;
        }

        .slide-caption h3 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes slide-cycle {
            0%, 28% { transform: translateX(0); }
            33%, 61% { transform: translateX(-33.333%); }
            66%, 94% { transform: translateX(-66.666%); }
            100% { transform: translateX(0); }
        }

        /* Gallery Grid */
        .bento-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 80px;
        }

        .gallery-item {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            transition: transform 0.4s ease;
        }

        .gallery-item:hover { transform: translateY(-10px); }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-label {
            padding: 20px;
            background: white;
            text-align: center;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<table class="menu-table">
    <tr>
        <td><a href="index.html" style="color: var(--accent);">Home</a></td>
        <td><a href="photo.html">Photography</a></td>
        <td><a href="design.html">Design</a></td>
        <td><a href="contact.html">Contact</a></td>
        <td><a href="video.html">Videos</a></td>
    </tr>
</table>

<div class="container">
    <header>
        <h1>VISUAL JOURNEY</h1>
        <p style="color: #64748b; letter-spacing: 5px; font-weight: 500;">PREMIUM PHOTOGRAPHY & VISUAL ART</p>
    </header>

    <div class="hero-slideshow">
        <div class="slide-container">
            <div class="slide">
                <img src="portrait_6.jpeg" class="blur-backdrop" alt="">
                <img src="portrait_6.jpeg" class="main-img" alt="Portrait Excellence">
                <div class="slide-caption">
                    <h3>Portrait Excellence</h3>
                </div>
            </div>
            
            <div class="slide">
                <img src="portrait_duo_action_1.jpeg" class="blur-backdrop" alt="">
                <img src="portrait_duo_action_1.jpeg" class="main-img" alt="Dynamic Moments">
                <div class="slide-caption">
                    <h3>Dynamic Moments</h3>
                </div>
            </div>
            
            <div class="slide">
                <img src="floodlight_landscape_photo.jpeg" class="blur-backdrop" alt="">
                <img src="floodlight_landscape_photo.jpeg" class="main-img" alt="Urban Perspectives">
                <div class="slide-caption">
                    <h3>Urban Perspectives</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="bento-gallery">
        <div class="gallery-item">
            <img src="portrait_2.jpeg" alt="Natural Light">
            <div class="gallery-label">Natural Light</div>
        </div>
        <div class="gallery-item">
            <img src="portrait_duo_1.jpeg" alt="Collaborations">
            <div class="gallery-label">Collaborations</div>
        </div>
    </div>
</div>

</body>
</html>
