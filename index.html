<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Journey | Fluid Portfolio</title>
    <style>
        :root {
            --accent: #00d1b2;
            --bg-page: #f8fafc;
        }

        body {
            background-color: var(--bg-page);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- ONLY MODIFIED MENU BAR START --- */
        .menu-table {
            width: 100%;
            background: #1a1a1a; /* Original dark background */
            position: sticky;
            top: 0;
            z-index: 1000;
            border-collapse: collapse;
        }

        .menu-table td { 
            padding: 25px; 
            text-align: center; 
        }

        .menu-table a {
            text-decoration: none;
            color: #ffffff; /* Original white text */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .menu-table a:hover { 
            color: var(--accent); 
        }
        /* --- ONLY MODIFIED MENU BAR END --- */

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 3.5rem; color: #1e293b; margin: 0; font-weight: 900; }

        /* NO-FLICKER STACKED SLIDESHOW */
        .hero-slideshow {
            position: relative;
            width: 100%;
            height: 600px;
            border-radius: 24px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: crossfade 15s infinite;
        }

        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 5s; }
        .slide:nth-child(3) { animation-delay: 10s; }

        .blur-backdrop {
            position: absolute;
            width: 110%;
            height: 110%;
            object-fit: cover;
            filter: blur(40px) brightness(0.5);
            z-index: 1;
        }

        .main-img {
            position: relative;
            z-index: 2;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 40px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            z-index: 10;
        }

        @keyframes crossfade {
            0%, 33.33% { opacity: 1; z-index: 2; }
            36.66%, 100% { opacity: 0; z-index: 1; }
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }
    </style>
</head>
<body>

<table class="menu-table">
    <tr>
        <td><a href="index.html" style="color: var(--accent);">Home</a></td>
        <td><a href="photo.html">Photography</a></td>
        <td><a href="design.html">Design</a></td>
        <td><a href="contact.html">Contact</a></td>
        <td><a href="video.html">Videos</a></td>
    </tr>
</table>

<div class="container">
    <header>
        <h1>VISUAL JOURNEY</h1>
        <p style="letter-spacing: 4px; color: #94a3b8;">PORTRAIT & DESIGN PORTFOLIO</p>
    </header>

    <div class="hero-slideshow">
        <div class="slide">
            <img src="portrait_6.jpeg" class="blur-backdrop">
            <img src="portrait_6.jpeg" class="main-img" alt="Portrait Excellence">
            <div class="slide-caption"><h3>Portrait Excellence</h3></div>
        </div>
        
        <div class="slide">
            <img src="portrait_duo_action_1.jpeg" class="blur-backdrop">
            <img src="portrait_duo_action_1.jpeg" class="main-img" alt="Dynamic Moments">
            <div class="slide-caption"><h3>Dynamic Moments</h3></div>
        </div>
        
        <div class="slide">
            <img src="floodlight_landscape_photo.jpeg" class="blur-backdrop">
            <img src="floodlight_landscape_photo.jpeg" class="main-img" alt="Urban Vibe">
            <div class="slide-caption"><h3>Urban Perspectives</h3></div>
        </div>
    </div>

    <div class="gallery-grid">
        <div class="card"><img src="portrait_2.jpeg"></div>
        <div class="card"><img src="portrait_duo_1.jpeg"></div>
    </div>
</div>

</body>
</html>
