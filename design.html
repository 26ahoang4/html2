<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Archive | Visual Journey</title>
    <style>
        :root {
            --accent: #9b59b6;
            --teal: #00d1b2;
            --bg: #ffffff;
            --ease: cubic-bezier(0.2, 1, 0.2, 1); /* Snappier easing */
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* RESTORED OG MENU BAR */
        .menu-table {
            width: 100%;
            background: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-collapse: collapse;
        }
        .menu-table td { padding: 25px; text-align: center; }
        .menu-table a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }
        .menu-table a:hover { color: var(--teal); }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        header h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 900;
            line-height: 0.8;
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: 220px;
            gap: 30px;
        }

        .card {
            position: relative;
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* GPU Optimization */
            transform: translateZ(0); 
            transition: transform 0.4s var(--ease);
        }

        .card:hover { transform: translateY(-8px) scale(1.01); z-index: 10; }

        /* OPTIMIZED BLUR: Using opacity only for transitions */
        .blur-bg {
            position: absolute;
            top: -15%; left: -15%;
            width: 130%; height: 130%;
            object-fit: cover;
            filter: blur(30px) brightness(0.4);
            z-index: 1;
            opacity: 0.5;
            transition: opacity 0.3s linear;
            pointer-events: none;
            will-change: opacity;
        }
        .card:hover .blur-bg { opacity: 1; }

        .main-img {
            position: relative;
            z-index: 2;
            max-width: 80%;
            max-height: 75%;
            object-fit: contain;
            /* GPU Optimization */
            transform: translateZ(0);
            transition: transform 0.4s var(--ease);
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
        }
        .card:hover .main-img { transform: scale(1.04); }

        .card-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s var(--ease);
        }
        .card:hover .card-info { opacity: 1; transform: translateY(0); }

        .label-pill {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 22px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .label-pill h3 { margin: 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; }

        /* Grid Spans */
        .huge { grid-column: span 4; grid-row: span 3; }
        .tall { grid-column: span 2; grid-row: span 3; }
        .wide { grid-column: span 3; grid-row: span 2; }
        .standard { grid-column: span 3; grid-row: span 2; }
        .footer-cta { grid-column: span 4; grid-row: span 3; background: var(--accent); }

        .cta-content { position: relative; z-index: 5; text-align: center; color: white; padding: 40px; }
        .cta-btn {
            margin-top: 20px;
            display: inline-block;
            padding: 12px 35px;
            background: white;
            color: var(--accent);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
        }

        @media (max-width: 1100px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .huge, .tall, .wide, .standard, .footer-cta { grid-column: span 2; }
        }
    </style>
</head>
<body>

<table class="menu-table">
    <tr>
        <td><a href="index.html">Home</a></td>
        <td><a href="photo.html">Photography</a></td>
        <td><a href="design.html" style="color: var(--teal);">Design</a></td>
        <td><a href="contact.html">Contact</a></td>
        <td><a href="video.html">Videos</a></td>
    </tr>
</table>

<div class="container">
    <header>
        <h1>DESIGN STUDIO</h1>
        <p style="letter-spacing: 8px; color: #999; text-transform: uppercase; margin-top: 20px;">Featured Visuals</p>
    </header>

    <div class="bento-grid">
        <div class="card huge">
            <img src="rising_star_design.jpeg" class="blur-bg">
            <img src="rising_star_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>Rising Star</h3></div></div>
        </div>
        <div class="card tall">
            <img src="lone_balloon_design.jpeg" class="blur-bg">
            <img src="lone_balloon_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>Lone Balloon</h3></div></div>
        </div>
        <div class="card wide">
            <img src="night_forest_design.jpeg" class="blur-bg">
            <img src="night_forest_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>Night Forest</h3></div></div>
        </div>
        <div class="card wide">
            <img src="pen_tool_landscape_design.jpeg" class="blur-bg">
            <img src="pen_tool_landscape_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>The Landscape</h3></div></div>
        </div>
        <div class="card standard">
            <img src="cherish_a_curious_creation_design.jpeg" class="blur-bg">
            <img src="cherish_a_curious_creation_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>Curious Creation</h3></div></div>
        </div>
        <div class="card standard">
            <img src="golden_flourish_design.jpeg" class="blur-bg">
            <img src="golden_flourish_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>Golden Flourish</h3></div></div>
        </div>
        <div class="card tall">
            <img src="paint_tree_design.jpeg" class="blur-bg">
            <img src="paint_tree_design.jpeg" class="main-img">
            <div class="card-info"><div class="label-pill"><h3>Paint Tree</h3></div></div>
        </div>
        <div class="card footer-cta">
            <img src="myself_portrait.jpeg" class="blur-bg" style="opacity: 0.3;">
            <div class="cta-content">
                <h2 style="font-size: 2.5rem; margin: 0; text-transform: uppercase;">Work with me</h2>
                <a href="contact.html" class="cta-btn">Get In Touch</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
